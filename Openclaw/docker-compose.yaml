# OpenClaw Gateway - based on the official docker-compose.yml
# https://docs.openclaw.ai/install/docker
#
# All persistent data lives in a Docker named volume mounted at /home/node.
# Re-running `docker compose up -d` recreates containers and reattaches the same data.

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_BASE_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: ${OPENCLAW_IMAGE:-openclaw-custom:latest}
    container_name: openclaw-gateway
    env_file:
      - path: .env                 # all provider keys, token, port, etc. come from here
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side paths so host values in .env can't leak into the container (#77436)
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      # Persist OpenClaw state + Claude CLI install/login in Docker-managed storage
      - openclaw-home:/home/node
      # Optional: enable sandbox isolation (needs docker CLI in image + docker socket)
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"   # Control UI / API  -> http://127.0.0.1:18789/
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"    # Bridge
    entrypoint: ["/usr/local/bin/openclaw-startup.sh"]
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama / LM Studio
    networks:
      default: {}
      browser:
        ipv4_address: 172.28.0.3              # the only client allowed to reach Chrome CDP
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-off CLI commands, e.g.:
  #   docker compose run --rm openclaw-cli dashboard --no-open
  #   docker compose run --rm openclaw-cli onboard
  openclaw-cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_BASE_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: ${OPENCLAW_IMAGE:-openclaw-custom:latest}
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"   # shares gateway's network namespace
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - openclaw-home:/home/node
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    profiles: ["cli"]              # only started when you run openclaw-cli explicitly
    depends_on:
      - openclaw-gateway

  # Stateful Brave browser: cookies/logins persist in the chrome-profile volume.
  # CDP (DevTools) is NOT published to the host. It is reachable only from the
  # gateway, on the dedicated "browser" network (nginx allows 172.28.0.3 only).
  # noVNC for manual sign-in (localhost only): http://127.0.0.1:${CHROME_NOVNC_PORT:-6080}/vnc.html
  chrome:
    build:
      context: ./docker/chrome
      dockerfile: Dockerfile
    image: ${CHROME_IMAGE:-openclaw-chrome:local}
    container_name: openclaw-chrome
    environment:
      TZ: ${OPENCLAW_TZ:-UTC}
      CHROME_PROFILE_DIR: /data/chrome-profile
      CHROME_CDP_PORT: "9222"
      NOVNC_PORT: "6080"
    volumes:
      - chrome-profile:/data/chrome-profile
    ports:
      - "127.0.0.1:${CHROME_NOVNC_PORT:-6080}:6080"  # noVNC GUI - localhost only
    networks:
      browser:
        ipv4_address: 172.28.0.2
    shm_size: "1gb"
    init: true
    restart: unless-stopped

volumes:
  openclaw-home:
    name: ${OPENCLAW_HOME_VOLUME_NAME:-openclaw_home}
  chrome-profile:
    name: ${CHROME_PROFILE_VOLUME_NAME:-openclaw_chrome_profile}

networks:
  browser:
    name: openclaw_browser
    ipam:
      config:
        - subnet: 172.28.0.0/24